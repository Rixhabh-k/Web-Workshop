<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do App</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div id="main">
        <div class="todo-conatiner">
            <div class="greeting">
                <p>Good Evening</p>
                <p>07:10 PM</p>
            </div>
            <div class="header">
                <h1>Let's get things done.</h1>
                <p>You have 3 active tasks. Keep going!</p>
            </div>
            <div class="input-box">
                <div class="input-field">
                    <span class="plus">+</span>
                    <input class="task-input" type="text" placeholder="Enter your task" >
                </div>
                <button class="add-btn" >Add Taks</button>
            </div>
            <div class="task-container">

                
                


            </div>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
